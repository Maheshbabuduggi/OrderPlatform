<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Platform</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --pending: #f59e0b;
    --processed: #22c55e;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
    max-width: 1100px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .panel h2 { margin-top: 0; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%;
    padding: 9px 10px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 10px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #0f172a;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #formMessage { margin-top: 12px; font-size: 13px; min-height: 18px; }
  #formMessage.error { color: var(--error); }
  #formMessage.success { color: var(--processed); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.Pending { background: rgba(245,158,11,0.15); color: var(--pending); }
  .badge.Processed { background: rgba(34,197,94,0.15); color: var(--processed); }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .refresh-note { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>

<h1>Order Platform</h1>
<p class="subtitle">Create an order, then watch its status flip from Pending → Processed once the Azure Function consumes the event.</p>

<div class="layout">
  <div class="panel">
    <h2>New Order</h2>
    <form id="orderForm">
      <label for="customerName">Customer Name</label>
      <input id="customerName" required maxlength="200" placeholder="Asha Rao" />

      <label for="productName">Product Name</label>
      <input id="productName" required maxlength="200" placeholder="Wireless Mouse" />

      <label for="quantity">Quantity</label>
      <input id="quantity" type="number" min="1" required value="1" />

      <label for="price">Price</label>
      <input id="price" type="number" min="0.01" step="0.01" required placeholder="799.00" />

      <button type="submit" id="submitBtn">Create Order</button>
      <div id="formMessage"></div>
    </form>
  </div>

  <div class="panel">
    <h2>Orders</h2>
    <div id="ordersContainer">
      <div class="empty">Loading orders…</div>
    </div>
    <div class="refresh-note">Auto-refreshing every 2 seconds.</div>
  </div>
</div>

<script>
  const API_BASE = ""; // same-origin: served from the API itself, no CORS needed

  const form = document.getElementById("orderForm");
  const submitBtn = document.getElementById("submitBtn");
  const formMessage = document.getElementById("formMessage");
  const ordersContainer = document.getElementById("ordersContainer");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    formMessage.textContent = "";
    formMessage.className = "";

    const payload = {
      customerName: document.getElementById("customerName").value,
      productName: document.getElementById("productName").value,
      quantity: Number(document.getElementById("quantity").value),
      price: Number(document.getElementById("price").value)
    };

    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        const firstError = body.errors
          ? Object.values(body.errors)[0]?.[0]
          : "Request failed";
        throw new Error(firstError || `HTTP ${res.status}`);
      }

      formMessage.textContent = "Order created — watch it appear below.";
      formMessage.className = "success";
      form.reset();
      document.getElementById("quantity").value = 1;
      await loadOrders();
    } catch (err) {
      formMessage.textContent = err.message;
      formMessage.className = "error";
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function loadOrders() {
    try {
      const res = await fetch(`${API_BASE}/api/orders`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const orders = await res.json();
      renderOrders(orders);
    } catch (err) {
      ordersContainer.innerHTML = `<div class="empty">Could not load orders: ${err.message}</div>`;
    }
  }

  function renderOrders(orders) {
    if (!orders.length) {
      ordersContainer.innerHTML = `<div class="empty">No orders yet — create one on the left.</div>`;
      return;
    }

    const rows = orders.map(o => `
      <tr>
        <td>${escapeHtml(o.customerName)}</td>
        <td>${escapeHtml(o.productName)}</td>
        <td>${o.quantity}</td>
        <td>$${Number(o.price).toFixed(2)}</td>
        <td><span class="badge ${o.status}">${o.status}</span></td>
        <td>${new Date(o.createdAt).toLocaleTimeString()}</td>
      </tr>
    `).join("");

    ordersContainer.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Customer</th><th>Product</th><th>Qty</th><th>Price</th><th>Status</th><th>Created</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadOrders();
  setInterval(loadOrders, 2000);
</script>

</body>
</html>
