<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Platform</title>

<style>
:root{
    --bg:#0b1220;
    --panel:#111827;
    --panel2:#1f2937;
    --border:#374151;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --blue:#2563eb;
    --green:#22c55e;
    --yellow:#f59e0b;
    --red:#ef4444;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Roboto,Arial,sans-serif;
    padding:30px;
}

/* Header */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

header h1{
    font-size:30px;
}

header p{
    color:var(--muted);
    margin-top:4px;
}

.live{
    display:flex;
    align-items:center;
    gap:8px;
    background:#12213d;
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{opacity:.4;}
    50%{opacity:1;}
    100%{opacity:.4;}
}

/* Stats */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
    margin-bottom:24px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.card h3{
    color:var(--muted);
    font-size:14px;
    margin-bottom:8px;
}

.card p{
    font-size:34px;
    font-weight:bold;
}

/* Layout */
.container{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:20px;
}

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.panel h2{
    margin-bottom:18px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

#lastRefresh{
    color:var(--muted);
    font-size:12px;
}

/* Form */
label{
    display:block;
    margin:12px 0 6px;
    color:var(--muted);
    font-size:13px;
}

input{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0b1220;
    color:white;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:var(--blue);
}

button{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--blue);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{background:#1d4ed8;}
button:disabled{opacity:.6;cursor:not-allowed;}

#formMessage{
    margin-top:12px;
    font-size:13px;
    min-height:18px;
}

.success{color:var(--green);}
.error{color:var(--red);}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    color:var(--muted);
    font-size:13px;
    padding:12px;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px;
    border-bottom:1px solid #1f2937;
    font-size:14px;
}

.badge{
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.Pending{
    background:#3a2b06;
    color:var(--yellow);
}

.Processed{
    background:#052e16;
    color:var(--green);
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:30px;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<header>
    <div>
        <h1>Order Platform</h1>
        <p>Azure SQL • Event Hub • Azure Function • Docker</p>
    </div>

    <div class="live">
        <span class="dot"></span>
        Live
    </div>
</header>

<section class="stats">
    <div class="card">
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <p id="pendingOrders">0</p>
    </div>

    <div class="card">
        <h3>Processed</h3>
        <p id="processedOrders">0</p>
    </div>
</section>

<div class="container">

    <!-- Left -->
    <div class="panel">
        <h2>Create Order</h2>

        <form id="orderForm">

            <label>Customer Name</label>
            <input id="customerName" required maxlength="100" placeholder="Mahesh Duggi">

            <label>Product Name</label>
            <input id="productName" required maxlength="100" placeholder="MacBook Pro">

            <label>Quantity</label>
            <input id="quantity" type="number" min="1" value="1" required>

            <label>Price</label>
            <input id="price" type="number" min="1" step="0.01" placeholder="1299.99" required>

            <button id="submitBtn" type="submit">Create Order</button>

            <div id="formMessage"></div>
        </form>
    </div>

    <!-- Right -->
    <div class="panel">

        <div class="panel-header">
            <h2>Orders</h2>
            <span id="lastRefresh">--</span>
        </div>

        <div id="ordersContainer">
            <div class="empty">Loading...</div>
        </div>

    </div>
</div>

<script>
const API_BASE="";

const form=document.getElementById("orderForm");
const submitBtn=document.getElementById("submitBtn");
const message=document.getElementById("formMessage");
const container=document.getElementById("ordersContainer");

form.addEventListener("submit",async(e)=>{
    e.preventDefault();

    submitBtn.disabled=true;
    message.className="";
    message.textContent="";

    const payload={
        customerName:customerName.value,
        productName:productName.value,
        quantity:Number(quantity.value),
        price:Number(price.value)
    };

    try{
        const res=await fetch(`${API_BASE}/api/orders`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        });

        if(!res.ok){
            const err=await res.json().catch(()=>({}));
            throw new Error(err.title || "Failed to create order");
        }

        message.className="success";
        message.textContent="Order created successfully";

        form.reset();
        quantity.value=1;

        await loadOrders();
    }
    catch(ex){
        message.className="error";
        message.textContent=ex.message;
    }
    finally{
        submitBtn.disabled=false;
    }
});

async function loadOrders(){
    try{
        const res=await fetch(`${API_BASE}/api/orders`);
        if(!res.ok) throw new Error();

        const orders=await res.json();
        renderOrders(orders);

        totalOrders.textContent=orders.length;
        pendingOrders.textContent=orders.filter(x=>x.status==="Pending").length;
        processedOrders.textContent=orders.filter(x=>x.status==="Processed").length;

        lastRefresh.textContent="Updated " + new Date().toLocaleTimeString();
    }
    catch{
        container.innerHTML='<div class="empty">Unable to connect to API</div>';
    }
}

function renderOrders(orders){

    if(orders.length===0){
        container.innerHTML='<div class="empty">No orders found</div>';
        return;
    }

    const rows=orders.map(o=>`
        <tr>
            <td>${escapeHtml(o.customerName)}</td>
            <td>${escapeHtml(o.productName)}</td>
            <td>${o.quantity}</td>
            <td>₹${Number(o.price).toFixed(2)}</td>
            <td><span class="badge ${o.status}">${o.status}</span></td>
            <td>${new Date(o.createdAt).toLocaleString()}</td>
        </tr>
    `).join("");

    container.innerHTML=`
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody>
                ${rows}
            </tbody>
        </table>
    `;
}

function escapeHtml(text){
    const div=document.createElement("div");
    div.textContent=text;
    return div.innerHTML;
}

loadOrders();
setInterval(loadOrders,2000);
</script>

</body>
</html>
